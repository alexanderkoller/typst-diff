[package]
name = "typst-diff"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "typst-diff"
path = "src/main.rs"

[dependencies]
typst = "0.14.2"
typst-eval = "0.14.2"
typst-layout = "0.14.2"
typst-pdf = "0.14.2"
typst-kit = "0.14.2"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
