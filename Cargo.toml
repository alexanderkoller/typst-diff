[package]
name = "typst-diff"
version = "0.1.0"
edition = "2024"
description = "Diff two Typst documents and produce a PDF showing word-level changes"
license = "MIT"
repository = "https://github.com/alexanderkoller/typst-diff"
keywords = ["typst", "diff", "pdf"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["tests/", "docs/", "*.md", "**/*.md", "*.orig", "**/*.orig", ".*"]

[lib]
name = "typst_diff"
path = "src/lib.rs"

[[bin]]
name = "typst-diff"
path = "src/main.rs"

[dependencies]
typst = "0.14.2"
typst-eval = "0.14.2"
typst-layout = "0.14.2"
typst-pdf = "0.14.2"
typst-kit = { version = "0.14.2", features = ["embed-fonts"] }
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[dev-dependencies]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
