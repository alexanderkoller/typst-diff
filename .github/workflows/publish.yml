name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tgz
            bin: typst-diff
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tgz
            bin: typst-diff
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tgz
            bin: typst-diff
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: typst-diff.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release tag
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${crate_version}"
          if [ "${{ github.event.release.tag_name }}" != "$expected_tag" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match Cargo.toml version ${crate_version}; expected ${expected_tag}."
            exit 1
          fi
          echo "PACKAGE_VERSION=$crate_version" >> "$GITHUB_ENV"

      - name: Set reproducible build timestamp
        shell: bash
        run: |
          epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$epoch"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.bin }} --help

      - name: Package
        shell: bash
        run: |
          package="typst-diff-${{ matrix.target }}-v${PACKAGE_VERSION}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$package/"
          cp README.md LICENSE "$package/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${package}.zip" "$package"
          else
            tar -czf "${package}.tgz" "$package"
          fi

      - name: Upload binary archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="typst-diff-${{ matrix.target }}-v${PACKAGE_VERSION}.${{ matrix.archive }}"
          gh release upload "${{ github.event.release.tag_name }}" "$package" --clobber

  publish:
    name: Publish crate
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${crate_version}"
          if [ "${{ github.event.release.tag_name }}" != "$expected_tag" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match Cargo.toml version ${crate_version}; expected ${expected_tag}."
            exit 1
          fi

      - name: Set reproducible build timestamp
        run: |
          epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$epoch"

      - name: Test
        run: cargo test --locked

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
